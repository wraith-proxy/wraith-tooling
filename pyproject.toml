[project]
name = "wraith-tooling"
version = "0.1.0"
description = "Tooling for wraith plugin repositories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3", "pytest>=9.2.0", "commitizen==4.19.3"]

[project.scripts]
wraith-build-copilot = "wraith_tools.build_copilot:main"
wraith-drift-issues = "wraith_tools.drift_issues:main"
wraith-lint-skills = "wraith_tools.lint_skills:main"
wraith-privacy-scan = "wraith_tools.privacy_scan:main"
wraith-release-gate = "wraith_tools.release_gate:main"
wraith-release-notes = "wraith_tools.release_notes:main"
wraith-sync-commit-type = "wraith_tools.sync_commit_type:main"
wraith-sync-upstream = "wraith_tools.sync_upstream:main"
wraith-vet-companion = "wraith_tools.vet_companion:main"
wraith-fetch-upstream = "wraith_tools.fetch_upstream:main"
wraith-file-types = "wraith_tools.file_types:main"
wraith-check-plugin = "wraith_tools.check_plugin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wraith_tools"]
include = ["src/wraith_tools/**/*.py", "src/wraith_tools/*.md", "src/wraith_tools/*.sh"]

[dependency-groups]
dev = ["pytest-cov", "ruff", "pre-commit"]

[tool.ruff]
line-length = 79

[tool.pytest.ini_options]
addopts = "--cov=wraith_tools --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/wraith_tools/plugin_checks/*"]
